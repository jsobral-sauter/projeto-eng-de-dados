max_album_pages: 2

# Enriquecimento externo: gêneros de artistas e métricas de tracks.
# lastfm (requer LASTFM_API_KEY) | musicbrainz (sem chave, apenas gêneros)
enrichment:
  enabled: true
  provider: lastfm
  max_artists: 600
  max_tracks: 4000
  request_interval: 0.3
  genres_per_artist: 10

# Dados pessoais do dono do app (exigem OAuth Authorization Code)
user_top_time_ranges:
  - medium_term
  - long_term
user_recently_played_limit: 50

